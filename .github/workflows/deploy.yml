name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet test --configuration Release

      - run: dotnet publish src/HomeworkTemplates.Web -c Release -o publish

      - name: Rewrite base href for the project subpath
        run: sed -i 's|<base href="/" />|<base href="/homework-templates/" />|' publish/wwwroot/index.html

      - name: Copy index to 404 for deep-link fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Ensure .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
