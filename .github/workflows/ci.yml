# Until this existed, "mergeable" on a pull request only meant "no conflict": there was no build
# check, so whoever merged had to clone the merge ref and build it by hand. This is that build.
name: CI

# Pull requests only. deploy.yml already runs test and publish on every push to main, so a push
# trigger here would build main twice for the same commit.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A new push supersedes the run it made obsolete instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same pin as deploy.yml, deliberately. If the SDK moves for one it moves for both.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      # Release, matching deploy.yml, so this check fails before a merge breaks the Pages deploy
      # rather than after.
      - run: dotnet build -c Release --no-restore

      - run: dotnet test -c Release --no-build
